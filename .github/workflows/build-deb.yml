name: Build DEB Package

on:
  workflow_call:

jobs:
  build-deb:
    name: Build DEB Package
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ARCH: ['x86_64']

    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Generate TAG
        id: tag
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag='continuous'
          name='Continuous Build'
          if [[ "$IS_TAG" == 'true' ]]; then
            tag="$REF_NAME"
            name="$REF_NAME"
          fi
          echo "tag result: $tag - $name"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot devscripts debhelper

      - name: Build Deb Package
        env:
          BUILD_VERSION: ${{ steps.tag.outputs.tag }}
          SIGN_DEB: false
          WINE: 'false'
        run: |
          mkdir -p tmp/build
          tools/build-prepare.sh
          tools/build-deepin.sh "${{ steps.tag.outputs.tag }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-devtools-deb-${{ matrix.ARCH }}.build
          path: tmp/build
          if-no-files-found: error
          compression-level: 0
